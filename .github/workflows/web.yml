name: Web Console

# `next build` in web/ was broken on main (a duplicate `const CONSOLE_TOKEN` in
# web/app/v1/[...path]/route.ts) and nothing noticed, because no workflow ever
# installed, linted, type-checked or built the console. This one does.
#
# Every PR runs it, so a PR that breaks web/ cannot go green. Pushes to main run
# it only when web/ or this workflow changed: the PR already proved the same tree.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Superseded PR pushes are cancelled; a run on main is never cancelled, so
  # every main commit keeps a real verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: web (lint, typecheck, next build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Node 24 LTS, pinned to an exact release so the toolchain that
          # proved the build is the one named here.
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile only, no install scripts)
        # --no-audit: advisories are gated by Dependency Review and Dependabot,
        # not re-reported as noise in every build log.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
