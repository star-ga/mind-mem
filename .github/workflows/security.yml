name: Supply-Chain Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── CodeQL SAST ──────────────────────────────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          languages: python
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          category: /language:python

  # ── pip-audit dependency audit ───────────────────────────────────────────────
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --desc \
            --format json \
            --output pip-audit-results.json \
            -r <(pip install --dry-run . 2>&1 | grep "Requirement already satisfied\|Would install" || true) \
            . || true
          # Also run directly against pyproject.toml dependencies
          pip install . --dry-run 2>/dev/null || true
          pip-audit --desc --format json --output pip-audit-results.json . || EXIT=$?
          cat pip-audit-results.json
          exit ${EXIT:-0}

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 90

  # ── Bandit SAST → SARIF → Code Scanning ─────────────────────────────────────
  bandit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[sarif]

      - name: Run bandit
        run: bandit -r src -f sarif -o bandit.sarif || true

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── Gitleaks secret scanning ─────────────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── CycloneDX SBOM generation ─────────────────────────────────────────────────
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM
        # CycloneDX/gh-python-generate-sbom@v2 installs cyclonedx-bom<4,
        # whose CLI imports ``pkg_resources`` — removed in setuptools 78+.
        # Install cyclonedx-bom>=5 directly and invoke the new CLI instead.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cyclonedx-bom>=5"
          cyclonedx-py environment \
            --output-format json \
            --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cdx
          path: sbom.cdx.json
          retention-days: 90

      - name: Attach SBOM to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v2
        with:
          files: sbom.cdx.json

  # ── Docker / Trivy image scan (always runs; gates work at step level) ───────
  # Job is unconditional so it concludes SUCCESS instead of SKIPPED on PRs
  # that don't touch Dockerfile. Heavy steps (build + scan) gate on the
  # diff check below.
  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 2  # need parent for `HEAD^` diff

      - name: Check if Dockerfile changed
        id: df_changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$base" "$head" | grep -E 'Dockerfile|deploy/docker/' || true)
          else
            changed=$(git diff --name-only "${{ github.event.before || 'HEAD^' }}" HEAD | grep -E 'Dockerfile|deploy/docker/' || true)
          fi
          if [ -n "$changed" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile change detected — running scan"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile change — scan steps are no-ops, job will SUCCESS"
          fi

      - name: Build Docker image
        if: steps.df_changed.outputs.changed == 'true'
        run: |
          docker build -t mind-mem:scan \
            -f ${DOCKERFILE:-Dockerfile} .

      - name: Run Trivy image scan
        if: steps.df_changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mind-mem:scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always() && steps.df_changed.outputs.changed == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy
