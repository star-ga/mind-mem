name: Supply-Chain Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── CodeQL SAST ──────────────────────────────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          languages: python
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          category: /language:python

  # ── pip-audit dependency audit ───────────────────────────────────────────────
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # This job used to audit NOTHING. `pyproject.toml` declares
        # `dependencies = []` — every third-party package lives in an extra — so
        # `pip-audit .` resolved an empty dependency set and always passed, and
        # the `|| true` swallowed whatever was left. A gate that cannot fail is
        # not a gate.
        #
        # Audit the INSTALLED environment with the extras actually shipped, so
        # transitive chains are in scope. Measured 2026-09-07: fastmcp 3.4.7
        # requires fastmcp-slim[client,server]==3.4.7 unconditionally, and both
        # of those extras require authlib>=1.6.11 — a hard transitive dependency
        # that the old invocation could never have seen.
        run: |
          set -euo pipefail
          pip install '.[all]'
          # Environment mode: no target argument, so the resolved venv is what
          # gets audited rather than an empty project.
          pip-audit --desc --format json --output pip-audit-results.json
          cat pip-audit-results.json

      - name: Prove the audit had a non-empty dependency set
        # Guards the failure this step replaced: if the audit set is ever empty
        # again, fail here rather than reporting a green that means nothing.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          data = json.load(open("pip-audit-results.json"))
          deps = data.get("dependencies", data if isinstance(data, list) else [])
          if len(deps) < 10:
              sys.exit(f"pip-audit saw {len(deps)} packages — the audit set is empty or truncated")
          print(f"pip-audit covered {len(deps)} packages")
          PY

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 90

  # ── Bandit SAST → SARIF → Code Scanning ─────────────────────────────────────
  bandit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[sarif]

      - name: Run bandit
        run: bandit -r src -f sarif -o bandit.sarif || true

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── Gitleaks secret scanning ─────────────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── CycloneDX SBOM generation ─────────────────────────────────────────────────
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM
        # CycloneDX/gh-python-generate-sbom@v2 installs cyclonedx-bom<4,
        # whose CLI imports ``pkg_resources`` — removed in setuptools 78+.
        # Install cyclonedx-bom>=5 directly and invoke the new CLI instead.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cyclonedx-bom>=5"
          cyclonedx-py environment \
            --output-format json \
            --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cdx
          path: sbom.cdx.json
          retention-days: 90

      - name: Attach SBOM to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v2
        with:
          files: sbom.cdx.json

  # ── Docker / Trivy image scan (always runs; gates work at step level) ───────
  # Job is unconditional so it concludes SUCCESS instead of SKIPPED on PRs
  # that don't touch Dockerfile. Heavy steps (build + scan) gate on the
  # diff check below.
  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 2  # need parent for `HEAD^` diff

      - name: Check if Dockerfile changed
        id: df_changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$base" "$head" | grep -E 'Dockerfile|deploy/docker/' || true)
          else
            changed=$(git diff --name-only "${{ github.event.before || 'HEAD^' }}" HEAD | grep -E 'Dockerfile|deploy/docker/' || true)
          fi
          if [ -n "$changed" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile change detected — running scan"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile change — scan steps are no-ops, job will SUCCESS"
          fi

      - name: Build Docker image
        if: steps.df_changed.outputs.changed == 'true'
        run: |
          docker build -t mind-mem:scan \
            -f ${DOCKERFILE:-Dockerfile} .

      - name: Run Trivy image scan
        if: steps.df_changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mind-mem:scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Documented, narrowly-scoped ignores for pip's un-upgradable
          # vendored deps (setuptools 70.3.0 / msgpack 1.1.2). See .trivyignore.
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && steps.df_changed.outputs.changed == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy
