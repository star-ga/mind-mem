name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Auto-cancel superseded runs on the same ref so a chain of fast-follow
# pushes doesn't pile up zombie in-progress runs that the GitHub backend
# can no longer cancel via API.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Pin ruff: an unpinned `pip install ruff` silently upgrades on every
      # ruff release, and ruff's lint/format rules drift between minors —
      # which spontaneously turns this job red on untouched code. Bump
      # deliberately (and run `ruff check --fix && ruff format` once) when raising.
      - run: pip install ruff==0.15.15
      # Lint the WHOLE repository, not just src/ tests/. The old two-path scope
      # left 62 of the 903 tracked .py files unlinted: 6 root-level (conftest.py,
      # conftest_trace.py, mcp_server.py, setup.py, generate_mind7b_training.py,
      # train_mind7b_runpod.py), benchmarks/ 32, train/ 17, scripts/ 5,
      # examples/ 2. That blind spot was not hypothetical -- it hid 9 real
      # errors in conftest_trace.py (E401 x1, I001 x1, E701 x6, E702 x1) for as
      # long as the file existed, and `ruff check src/ tests/` reported "All
      # checks passed" the whole time. scripts/ is the most costly omission of
      # the five: several release/CI gates are implemented there, so the code
      # that guards the release was itself unguarded.
      # Measured on the committed tree (1ec7f63) before widening: `ruff check .`
      # finds exactly those 9 errors and nothing else -- benchmarks/, train/,
      # scripts/ and examples/ each report zero -- so with conftest_trace.py
      # fixed this widening is clean at zero cost and can only ratchet.
      - run: ruff check .
      - name: Format check
        # Deliberately narrower than `ruff check .` above. This is a staging
        # decision with a counted reason, not a tolerated ignore list:
        # `ruff format` is whitespace normalisation, and on the committed tree
        # (1ec7f63) 29 of the 903 tracked .py files predate it. 27 of those 29
        # are the two excluded directories -- benchmarks/ 15 of 32 (554 diff
        # lines) and train/ 12 of 17 (944 diff lines), 1498 lines of pure
        # formatting churn that buys no correctness and would bury the changes
        # that matter -- so those two are staged for a separate formatting-only
        # pass; they remain fully covered by `ruff check .` above.
        # The other 2 (conftest_trace.py, examples/mic_map_quickstart.py) are
        # FIXED rather than excluded, which is what lets this step be a ratchet
        # at zero: with them formatted, src/ (322 files), tests/ (519),
        # scripts/ (5), examples/ (2) and the 6 root-level files all report
        # "already formatted" -- 854 files, no exceptions.
        # Written as "." minus two named directories rather than as a list of
        # included paths on purpose: an include-list is exactly what produced
        # the blind spot above, because it never grew when new directories did.
        # This form covers any new file or directory by default.
        run: python3 -m ruff format --check . --exclude benchmarks --exclude train

  typecheck:
    # v3.7.0 M5: typecheck is now blocking (was continue-on-error: true).
    # mypy src/ is currently clean — keeping it green is part of the
    # release contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # numpy 2.5's bundled type stub (__init__.pyi) uses a PEP-695 `type`
      # statement that mypy (under our 3.10 type-check target) rejects as
      # "only supported in Python 3.12+", failing the gate on a third-party stub
      # rather than our code. Pin numpy < 2.5 for the type-check step ONLY — the
      # runtime/tests jobs keep the latest numpy. (Remove once mypy handles the
      # numpy 2.5 stub under a 3.10 target.)
      - run: pip install "numpy<2.5"
      - run: python -m mypy src/ --ignore-missing-imports

  test:
    # v3.7.0 M5: every advertised OS/Python combination must pass —
    # "advertised" means the classifiers in pyproject.toml, which stop at 3.13.
    runs-on: ${{ matrix.os }}
    # NO row is advisory. The 3.14 rows used to carry
    # `continue-on-error: ${{ matrix.python-version == '3.14' }}`, which makes a
    # job fail visibly red while the run it belongs to still concludes
    # `success` — so a red row read as a pass, both in the UI and in every gate
    # that consults the run conclusion.
    #
    # Measured before removing it, over the 198 runs of this workflow with job
    # data between 2026-05-24 and 2026-09-02 (`gh api .../actions/runs/<id>/jobs`):
    #   * 83 runs concluded `success`, and ZERO of them contain a single
    #     non-success job — so removing the forgiveness would not have turned
    #     one green run red;
    #   * ZERO runs had 3.14 rows as their ONLY red jobs — so in that whole
    #     window the setting never once changed a run's conclusion. It was not
    #     protecting anything; it was only hiding rows;
    #   * a 3.14 row failed while its same-OS 3.13 row passed 4 times (most
    #     recently run 33271995016, 2026-08-29), and every one of those runs was
    #     already red for other reasons. So 3.14 can still fail on its own, and
    #     from now on that failure stops the workflow instead of being filed as
    #     an advisory — which is the point: a red row is not green.
    #   * at HEAD (run 33579619488) all three 3.14 rows are green.
    #
    # The CHANGELOG "Known issue — Python 3.14" (anyio/TestClient teardown
    # segfault) is why 3.14 is still not in the pyproject classifiers. That is a
    # question about what we ADVERTISE; it is not a licence to run a row and
    # then ignore its answer. If the segfault resurfaces, this matrix goes red
    # and someone decides deliberately — fix it, or drop the row entirely.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # The A/B bench harness derives its task set from this repository's
          # own history and runs `git log <sha>` against it. actions/checkout
          # defaults to a depth-1 clone, where those commits do not exist, so
          # the harness tests failed with exit 128 on every matrix row while
          # passing locally against a full clone. History is 1189 commits /
          # 24 MB, so fetching all of it is cheaper than skipping the tests.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # No `allow-prereleases`. With it, a row named "3.14" could resolve to
          # a pre-release build, so the thing CI proved and the thing users run
          # would differ silently. Verified against actions/python-versions
          # versions-manifest.json on 2026-09-02: stable 3.14.7 publishes
          # linux-24.04/x64, darwin/arm64+x64 and win32/x64 builds, i.e. every
          # platform in this matrix, so every row resolves to a released
          # interpreter without it.
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Unit tests with coverage (ubuntu-3.12 only)
        # v4.0.9: coverage instrumentation across 5000+ tests is the
        # single biggest contributor to runner memory pressure. The
        # cov-fail-under=70 gate matters once per CI run, not 12×
        # across the matrix. Run --cov only on the canonical
        # ubuntu-3.12 row; other rows run the same test set without
        # the instrumentation overhead so they fit in the 7 GB
        # GitHub-hosted runner budget.
        # v4.0.6: -m "not stress" excludes stress-marked tests that
        # OOM-killed ubuntu runners (test_niah and the 5 files
        # marked file-level in v4.0.8). Stress tests still run via
        # `make test` for pre-release gating.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python3 -m pytest tests/ --ignore=tests/integration --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=70 --maxfail=50 -q -m "not stress" --timeout=120 --timeout-method=thread
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Unit tests (no coverage, other matrix rows)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: python3 -m pytest tests/ --ignore=tests/integration --maxfail=50 -q -m "not stress" --timeout=120 --timeout-method=thread
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Integration tests
        run: python3 -m pytest tests/integration/ -v -m "not stress"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Upload coverage report
        # Only ubuntu-3.12 generates coverage.xml (see v4.0.9 split above).
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check version consistency
        run: python src/mind_mem/check_version.py
      - name: Check MCP tool count consistency
        # Single source of truth for the registered MCP tool count.
        # Fails the build if the discovered count drifts from the expected
        # value. Bump the expected value here when tools are added/removed.
        run: python scripts/count_mcp_tools.py --check 102
      # Reachability, applied to the TOOL surface. The 5.0.0 sweep deleted 44
      # modules nothing imported; the generator of that debt was shipping
      # surface before consumers, and a 98-tool list is the most public
      # instance of the same habit. A tool in none of tested/documented/trained
      # is registered and unsupported: nothing teaches it, nothing proves it,
      # and nothing would notice if it broke. Currently zero -- so the gate is
      # a ratchet at zero, not a tolerated backlog.
      - name: Check MCP tool surface is supported
        run: python scripts/check_tool_surface.py --check 0
      # A doc naming a tool that does not exist is worse than an undocumented
      # tool: it sends a caller to a surface that will fail, and reads as
      # authoritative. CLAUDE.md carried ELEVEN such ghosts.
      - name: Check no doc names a tool that does not exist
        run: python scripts/check_tool_surface.py --check-doc-names
      - name: Check documented tool count matches the code
        # --check 97 above compares the CODE against a number written on this
        # line; it cannot see the docs. On 2026-08-28 that gap had the README
        # badge reading 89 while the prose beside it read 95, with sixteen more
        # doc locations stale. This step scans every living surface (README,
        # CLAUDE.md, docs/**) and fails on any tool-count claim or badge that
        # disagrees with the discovered count. Version- and date-stamped
        # records are exempt: a release note must keep the number that was
        # true for its release.
        run: python scripts/count_mcp_tools.py --check-docs

      - name: Reachability gate (no caller, no tick)
        run: python scripts/check_reachable_modules.py --check

  postgres:
    # The Postgres backend shipped with NO CI leg at all. 14 test files, 189
    # tests, gate themselves on MIND_MEM_TEST_PG_DSN and therefore skipped in
    # every run — "the Postgres backend works" was a local anecdote, not a
    # measurement, while the fleet runs Postgres in production.
    #
    # Verified locally on 2026-08-28 against pgvector/pgvector:pg16: 189 pass.
    # Two things that make this leg work and are easy to get wrong:
    #   1. The schema must be provisioned first. Without it, ping() correctly
    #      reports blocks_table=false and test_ping_live_ok fails — a real
    #      result about an unprovisioned database, not a product defect.
    #   2. pgvector is optional at runtime (block_store_postgres does a
    #      server-side capability check), but the image ships it so this leg
    #      exercises the vector path instead of silently skipping it.
    name: "postgres backend"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mmtest
          POSTGRES_PASSWORD: mmtest
          POSTGRES_DB: mmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmtest -d mmtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIND_MEM_TEST_PG_DSN: "postgresql://mmtest:mmtest@127.0.0.1:5432/mmtest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # The A/B bench harness derives its task set from this repository's
          # own history and runs `git log <sha>` against it. actions/checkout
          # defaults to a depth-1 clone, where those commits do not exist, so
          # the harness tests failed with exit 128 on every matrix row while
          # passing locally against a full clone. History is 1189 commits /
          # 24 MB, so fetching all of it is cheaper than skipping the tests.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,postgres]"
      - name: Enable pgvector and provision the schema
        # Done through psycopg rather than psql so this step depends only on
        # what the job already installs, not on a client binary happening to be
        # present on the runner image.
        #
        # Provisioning is load-bearing: without it ping() correctly reports
        # blocks_table=false on an empty database and the live ping test fails
        # -- a true statement about an unprovisioned database, not a defect.
        run: |
          python - <<'PROVISION'
          import os
          import psycopg
          from mind_mem.block_store_postgres import PostgresBlockStore

          dsn = os.environ["MIND_MEM_TEST_PG_DSN"]
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector;")

          store = PostgresBlockStore(dsn, schema="mind_mem")
          store._ensure_schema()
          status = store.ping(timeout=10.0)
          print("ping:", status)
          assert status["ok"] is True, status
          PROVISION
      - name: Postgres-backed tests
        run: |
          FILES=$(grep -rl "MIND_MEM_TEST_PG_DSN" tests/ --include='*.py' | tr '\n' ' ')
          echo "running: $FILES"
          python -m pytest $FILES -q -p no:randomly


  author-identity:
    # Catches the leak path that no local hook can: a commit made in another
    # clone, on another machine, where the repo-local identity was never set and
    # git fell through to a personal global default. Public history cannot be
    # un-leaked, so this must fail BEFORE a merge, not after.
    #
    # Scope is deliberately the commits this push/PR INTRODUCES, not all of
    # history: history already contains pre-existing violations, and a
    # whole-history check would be permanently red and therefore ignored.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Need the merge base, not a shallow tip, to compute the range.
          fetch-depth: 0
      - name: Check commit author identity
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A zero/absent BASE (new branch, force-push, first push) has no
          # meaningful range; check just the tip commit rather than all history.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
          else
            RANGE="${BASE}..${HEAD_SHA}"
          fi
          echo "checking range: $RANGE"
          bash scripts/check_author_identity.sh range "$RANGE"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Init test workspace
        run: python -m mind_mem.init_workspace /tmp/test-workspace
      - name: Validate workspace
        run: python -m mind_mem.validate_py /tmp/test-workspace

  extras-install:
    name: ".[${{ matrix.extra }}] installs"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [mcp, api, embeddings, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: pip install -e ".[${{ matrix.extra }}]"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extra }}]"
      - name: import mind_mem
        run: python -c "import mind_mem; print(mind_mem.__name__)"

  pinned-requirements:
    # v3.7.0 M5 follow-up: requirements-optional.txt only pins three
    # top-level packages (onnxruntime / tokenizers / sentence-
    # transformers); transitive deps are intentionally resolved by pip.
    # ``--require-hashes`` is implicitly enabled for the whole resolve
    # whenever ANY line has ``--hash=``, so a plain ``pip install`` of
    # this file fails on transitive deps that aren't pinned (the file
    # is a "minimum supported set" not a full lockfile). Generating a
    # full hashed lockfile (200+ entries) would silently expand the
    # file's scope; the audit's M5 intent ("prove the pinned versions
    # still resolve on a fresh runner so a yanked wheel breaks the
    # release, not prod") is satisfied by:
    #   1. ``pip download --no-deps --require-hashes`` — proves all
    #      three pins still exist on PyPI with the recorded hashes
    #   2. ``pip install`` of the same three top-level packages
    #      *without* the requirements file — proves the version line
    #      still resolves a working transitive closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify hashes for pinned wheels (gate against yanked wheels)
        run: |
          python -m pip install --upgrade pip
          python -m pip download --no-deps --require-hashes \
            --dest /tmp/hash-verify \
            -r requirements-optional.txt
      - name: Resolve transitive closure (gate against unsatisfiable deps)
        run: |
          python -m pip install \
            onnxruntime==1.24.2 \
            tokenizers==0.22.2 \
            sentence-transformers==5.2.3

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.0.0 — Node 24
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.1.0 — Node 24
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: mind-mem:ci

  compose-config:
    # v3.7.0 M6: prove docker-compose.yml renders cleanly with both the
    # default user/db AND an operator override. Pre-3.7.0 the postgres
    # healthcheck hardcoded ``pg_isready -U mindmem -d mindmem``, so an
    # operator who set POSTGRES_USER / POSTGRES_DB would see a healthy
    # postgres container reported as unhealthy. The new healthcheck
    # reads the env at probe time; this job validates the YAML still
    # interpolates and that the rendered command keeps the env-var
    # references intact under both defaults and overrides.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: defaults
            user: ""
            db: ""
          - name: overrides
            user: alice
            db: factsdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: docker compose config
        env:
          MIND_MEM_TOKEN: ci-token
          MIND_MEM_ADMIN_TOKEN: ci-admin
          POSTGRES_PASSWORD: ci-pg-pw
          POSTGRES_USER: ${{ matrix.scenario.user }}
          POSTGRES_DB: ${{ matrix.scenario.db }}
        run: |
          docker compose -f deploy/docker-compose.yml config > /tmp/rendered.yml
          # ``$$VAR`` in compose YAML renders as a literal ``$VAR`` once the
          # container shell expands it at probe time. The check confirms the
          # healthcheck still references ``POSTGRES_USER`` / ``POSTGRES_DB``
          # rather than baked-in literals — the M6 regression we are gating.
          grep -F 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' /tmp/rendered.yml

  install-smoke:
    name: install.sh smoke (${{ matrix.installer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [pipx, pip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pipx
        if: matrix.installer == 'pipx'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install package via documented one-liner
        # The README tells users to run pipx install "mind-mem[mcp]"
        # (or pip --user). This step exercises that exact path on a
        # clean runner so a regression there is caught before release.
        run: |
          if [ "${{ matrix.installer }}" = "pipx" ]; then
            pipx install --force ".[mcp]"
          else
            python -m pip install --user ".[mcp]"
          fi
      - name: mind-mem-mcp --help (smoke)
        run: mind-mem-mcp --help
      - name: install.sh wires clients without re-installing
        # Run with --no-install so the script just resolves
        # mind-mem-mcp on PATH and verifies it. The --claude-code flag
        # writes to ~/.claude/mcp.json (created on demand) and avoids
        # the interactive client picker.
        run: ./install.sh --no-install --workspace /tmp/test-workspace --claude-code
