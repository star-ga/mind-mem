version: 2
# Dependabot config for mind-mem. Mirrors the ecosystem pattern (mind runs
# dependabot + the security workflows already present here: codeql, security,
# security-review, audit-pinned, dependency-review, red-team). Grouped, weekly.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "npm"
    directory: "/sdk/js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      js-sdk:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-sdk:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
